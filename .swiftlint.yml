# SwiftLint for the laboratory.
# Criterion: warn about what is usually a real bug or smell, not about the dense style of kernel code
# (single-letter names such as M, N, K, B, P follow matrix notation). Formatting is decided by .swift-format.
# 0 warnings: scripts/ci.sh runs `swiftlint lint --strict` and fails on any. Exceptions go
# in the code with `// swiftlint:disable:next|this <rule> - <reason>` (hot paths and kernel wrappers).
included:
  - Sources
  - Tests
excluded:
  - .build
  - ref

disabled_rules:
  - identifier_name        # M, N, K, B, P, x, w, … are kernel notation
  - large_tuple            # benchmark result tuples (ms, bytes, …)
  - statement_position     # `} else {` on the same line as the closing brace in compact code
  - switch_case_alignment  # decided by swift-format
  - trailing_comma         # swift-format adds a trailing comma in multi-line collections
  - opening_brace          # swift-format moves the brace to its own line after multi-line conditions
  - optional_data_string_conversion  # String(decoding:as:) is deliberate: it replaces invalid UTF-8 with U+FFFD (split tokenizer tokens,
                                     # model output, standard input); String(bytes:encoding:)
                                     # would give nil and lose the whole text

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - unused_parameter
# force_unwrapping is not enabled: ~240 cases, almost all makeBuffer(...)! and makeCommandBuffer()!, which only fail when out of memory.

# Error thresholds sized to the current code (0 errors).
line_length:
  warning: 160
  error: 400
  ignores_comments: false
  ignores_urls: true

function_body_length:
  warning: 150
  error: 400
type_body_length:
  warning: 500
  error: 1000
file_length:
  warning: 800
  error: 1200
cyclomatic_complexity:
  warning: 25
  error: 60
function_parameter_count:
  warning: 8
  error: 16

force_cast: warning
force_try: warning
